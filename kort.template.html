<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAB ventelisteplaceringer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  color-scheme: light;
  --plane:      #f9f9f7;
  --surface:    #fcfcfb;
  --ink:        #0b0b0b;
  --ink-2:      #52514e;
  --ink-muted:  #898781;
  --hairline:   #e1e0d9;
  --ring:       rgba(11,11,11,.10);
  --shadow:     0 1px 3px rgba(11,11,11,.14), 0 6px 20px rgba(11,11,11,.08);
  /* sequential blue ordinal ramp, light -> dark (worst -> best) */
  --t1: #86b6ef; --t2: #5598e7; --t3: #2a78d6; --t4: #1c5cab; --t5: #0d366b;
  --on-light: #0b0b0b; --on-dark: #ffffff;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
    --ink-muted: #898781; --hairline: #2c2c2a; --ring: rgba(255,255,255,.12);
    --shadow: 0 1px 3px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.35);
    --t1: #184f95; --t2: #256abf; --t3: #3987e5; --t4: #6da7ec; --t5: #b7d3f6;
    --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
  --ink-muted: #898781; --hairline: #2c2c2a; --ring: rgba(255,255,255,.12);
  --shadow: 0 1px 3px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.35);
  --t1: #184f95; --t2: #256abf; --t3: #3987e5; --t4: #6da7ec; --t5: #b7d3f6;
  --accent: #3987e5;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}
.app { display: grid; grid-template-columns: 340px 1fr; height: 100dvh; }

/* ---------- side panel ---------- */
aside {
  background: var(--surface); border-right: 1px solid var(--hairline);
  overflow-y: auto; overscroll-behavior: contain;
}
.head { padding: 16px 16px 12px; border-bottom: 1px solid var(--hairline);
        position: sticky; top: 0; background: var(--surface); z-index: 2; }
h1 { margin: 0 0 2px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.sub { color: var(--ink-muted); font-size: 12px; }
.controls { padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
.grp { margin-bottom: 14px; }
.grp:last-child { margin-bottom: 4px; }
.lbl { display: flex; justify-content: space-between; align-items: baseline;
       font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
       color: var(--ink-muted); margin-bottom: 7px; }
.lbl b { font-weight: 600; color: var(--ink-2); text-transform: none; letter-spacing: 0;
         font-size: 12px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  border: 1px solid var(--hairline); background: transparent; color: var(--ink-2);
  border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12.5px;
  cursor: pointer; min-height: 28px; transition: background .12s, border-color .12s;
}
.chip:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.chip[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550;
}
input[type=range] { width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; min-width: 0; }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px;
           cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- legend ---------- */
.legend { padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
.scale { display: flex; gap: 2px; }
.scale div { flex: 1; height: 8px; border-radius: 2px; }
.scale-ends { display: flex; justify-content: space-between; margin-top: 5px;
              font-size: 11px; color: var(--ink-muted); }
.ranges { margin-top: 8px; display: grid; gap: 3px; font-size: 11.5px; color: var(--ink-2);
          font-variant-numeric: tabular-nums; }
.ranges span { display: flex; align-items: center; gap: 7px; }
.ranges i { width: 10px; height: 10px; border-radius: 3px; flex: none;
            box-shadow: inset 0 0 0 1px var(--ring); }

/* ---------- list ---------- */
.listhead { position: sticky; top: 0; background: var(--surface); z-index: 1;
            padding: 10px 16px 6px; display: flex; justify-content: space-between;
            align-items: baseline; font-size: 11px; text-transform: uppercase;
            letter-spacing: .04em; color: var(--ink-muted); font-weight: 600; }
.list { padding: 0 8px 16px; }
.item {
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center;
  width: 100%; text-align: left; background: none; border: 0; font: inherit;
  padding: 7px 8px; border-radius: 8px; cursor: pointer;
}
.item:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.item.on { background: color-mix(in srgb, var(--accent) 15%, transparent); }
.num {
  min-width: 46px; text-align: center; border-radius: 6px; padding: 3px 6px;
  font-size: 12.5px; font-weight: 650; font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px var(--ring);
}
.nm { display: block; font-size: 13px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: block; font-size: 11.5px; color: var(--ink-muted); overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 24px 16px; color: var(--ink-muted); font-size: 13px; }

/* ---------- map ---------- */
#map { height: 100%; background: var(--plane); }
.leaflet-container { font: inherit; background: var(--plane); }
/* the close-up street tiles are colourful; mute them so the markers stay the loudest thing */
.leaflet-detail-pane { filter: saturate(.2) brightness(1.04) contrast(.9); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .leaflet-detail-pane {
    filter: invert(1) hue-rotate(180deg) saturate(.12) brightness(.82) contrast(1.05);
  }
}
:root[data-theme="dark"] .leaflet-detail-pane {
  filter: invert(1) hue-rotate(180deg) saturate(.12) brightness(.82) contrast(1.05);
}
:root[data-theme="light"] .leaflet-detail-pane {
  filter: saturate(.2) brightness(1.04) contrast(.9);
}

.pinwrap { position: relative; width: 0; height: 0; }
.pin {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; align-items: center; justify-content: center;
  min-width: 32px; height: 19px; padding: 0 5px;
  border-radius: 5px; font-size: 11px; font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  box-shadow: 0 0 0 1.5px var(--surface), 0 1px 4px rgba(11,11,11,.35);
  cursor: pointer; transition: transform .1s;
}
.pin:hover, .pin.on { transform: translate(-50%, -50%) scale(1.18); z-index: 10000 !important; }
.pin.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent), 0 1px 4px rgba(11,11,11,.4); }
.pin sup { font-size: 8.5px; font-weight: 700; opacity: .8; margin-left: 2px; }
.pin.dot { min-width: 13px; width: 13px; height: 13px; padding: 0; border-radius: 50%;
           font-size: 0; overflow: hidden; }
.pin.dot sup { display: none; }

.leaflet-popup-content-wrapper {
  background: var(--surface); color: var(--ink); border-radius: 10px;
  box-shadow: var(--shadow); border: 1px solid var(--hairline);
}
.leaflet-popup-tip { background: var(--surface); border: 1px solid var(--hairline); }
.leaflet-popup-content { margin: 12px 14px; width: 292px !important; }
.leaflet-popup-close-button { color: var(--ink-muted) !important; }
.pop h2 { margin: 0; font-size: 14px; font-weight: 650; }
.pop .where { color: var(--ink-muted); font-size: 11.5px; margin: 2px 0 10px; }
.pop table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.pop th { text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: .03em;
          color: var(--ink-muted); font-weight: 600; padding: 0 0 4px 8px; white-space: nowrap; }
.pop th:first-child, .pop td:first-child { padding-left: 0; }
.pop th.r, .pop td.r { text-align: right; }
.pop td { padding: 5px 0 5px 8px; border-top: 1px solid var(--hairline); font-size: 12px;
          vertical-align: top; }
.pop tr.dim td { color: var(--ink-muted); }
.pop .pnum { display: inline-block; min-width: 42px; text-align: center; border-radius: 5px;
             padding: 2px 5px; font-weight: 650; font-size: 12px;
             box-shadow: inset 0 0 0 1px var(--ring); }
.pop .foot { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--hairline);
             font-size: 11px; color: var(--ink-muted); }
.pop .warn { color: var(--ink-2); }

.mapctl { position: absolute; z-index: 900; top: 10px; right: 10px; display: flex;
          gap: 6px; flex-wrap: wrap; justify-content: flex-end;
          max-width: calc(100% - 20px); }
.mapctl button {
  background: var(--surface); color: var(--ink-2); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer;
  box-shadow: var(--shadow); min-height: 32px;
}
.mapctl button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

.burger { display: none; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  aside { position: absolute; inset: 0 auto 0 0; width: min(340px, 88vw); z-index: 1200;
          transform: translateX(-101%); transition: transform .2s; box-shadow: var(--shadow); }
  aside.open { transform: none; }
  .controls { max-height: none; }
  .burger { display: block; position: absolute; z-index: 1300; top: 10px; left: 10px;
            transition: left .2s;
            background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
            padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 550;
            color: var(--ink); box-shadow: var(--shadow); cursor: pointer; }
  aside.open ~ .burger { left: calc(min(340px, 88vw) + 10px); }
}
</style>
</head>
<body>
<div class="app">
  <aside id="panel">
    <div class="head">
      <h1>AAB ventelisteplaceringer</h1>
      <div class="sub" id="subtitle"></div>
    </div>

    <div class="controls">
      <div class="grp">
        <div class="lbl">Antal rum <button class="linkbtn" data-all="rooms">alle</button></div>
        <div class="chips" id="f-rooms"></div>
      </div>
      <div class="grp">
        <div class="lbl">Område <button class="linkbtn" data-all="omr">alle</button></div>
        <div class="chips" id="f-omr"></div>
      </div>
      <div class="grp">
        <div class="lbl">Boligtype <button class="linkbtn" data-all="type">alle</button></div>
        <div class="chips" id="f-type"></div>
      </div>
      <div class="grp">
        <div class="lbl">Maks. husleje <b id="v-rent"></b></div>
        <input type="range" id="f-rent" min="0" max="100" value="100">
      </div>
      <div class="grp">
        <div class="lbl">Min. areal <b id="v-area"></b></div>
        <input type="range" id="f-area" min="0" max="100" value="0">
      </div>
      <div class="grp">
        <div class="lbl">Maks. placering <b id="v-max"></b></div>
        <input type="range" id="f-max" min="0" max="100" value="100">
      </div>
    </div>

    <div class="legend">
      <div class="lbl" style="margin-bottom:6px">Relativ placering <b id="v-count"></b></div>
      <div class="scale" id="scale"></div>
      <div class="scale-ends"><span>bedst</span><span>dårligst</span></div>
      <div class="ranges" id="ranges"></div>
    </div>

    <div class="listhead"><span>Opnoteringer</span><span id="v-listcount"></span></div>
    <div class="list" id="list"></div>
  </aside>

  <div style="position:relative">
    <div id="map"></div>
    <div class="mapctl">
      <button id="btn-best" aria-pressed="true" title="Vis kun den bedste placering pr. afdeling">Bedste pr. afdeling</button>
      <button id="btn-fit">Zoom ud</button>
      <button id="btn-theme" title="Skift mellem lyst og mørkt">Tema</button>
    </div>
  </div>
  <button class="burger" id="burger">Filtre</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);

/* ---- colour: 5-step sequential blue ordinal ramp, darkest = best ---- */
const cs = getComputedStyle(document.documentElement);
const RAMP = () => [1,2,3,4,5].map(i => cs.getPropertyValue("--t"+i).trim());
// tier 0 = worst (lightest) ... tier 4 = best (darkest)
function tierColors() { return RAMP(); }
function inkOn(tier) {
  // light theme: ramp darkens with tier -> white ink on the two darkest steps
  // dark theme:  ramp lightens with tier -> dark ink on the two lightest steps
  return isDark() ? (tier >= 3 ? "#0b0b0b" : "#ffffff")
                  : (tier >= 3 ? "#ffffff" : "#0b0b0b");
}

const kr  = n => n.toLocaleString("da-DK", {maximumFractionDigits: 0});
const m2  = n => n.toLocaleString("da-DK", {maximumFractionDigits: 1});

/* ---- flatten to one record per opnotering ---- */
const REC = [];
for (const p of DATA.places)
  for (const g of p.groups)
    REC.push({ place: p, g, active: g.placement !== null });

const ACTIVE = REC.filter(r => r.active);
const roomsAll = [...new Set(REC.map(r => r.g.rooms).filter(Boolean))].sort((a,b)=>a-b);
const omrAll   = [...new Set(DATA.places.map(p => p.omraade))];
const typeAll  = [...new Set(REC.map(r => r.g.cat))].sort();
const rentMax  = Math.max(...ACTIVE.map(r => r.g.rent_min || 0));
const areaMax  = Math.max(...ACTIVE.map(r => r.g.area_max || 0));
const plMax    = Math.max(...ACTIVE.map(r => r.g.placement));
const plMin    = Math.min(...ACTIVE.map(r => r.g.placement));

document.getElementById("subtitle").textContent =
  (DATA.venteliste ? `Venteliste ${DATA.venteliste} · ` : "") +
  `${ACTIVE.length} opnoteringer i ${DATA.places.length} afdelinger`;

/* ---- filter state ---- */
const S = {
  rooms: new Set(roomsAll), omr: new Set(omrAll), type: new Set(typeAll),
  rent: rentMax, area: 0, max: plMax, bestOnly: true, sel: null
};

function chips(host, values, key, label) {
  host.innerHTML = "";
  for (const v of values) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.textContent = label ? label(v) : v;
    b.title = String(v);
    b.setAttribute("aria-pressed", S[key].has(v));
    b.onclick = () => {
      S[key].has(v) ? S[key].delete(v) : S[key].add(v);
      if (!S[key].size) S[key] = new Set(values);          // never filter to nothing
      chips(host, values, key, label); render();
    };
    host.appendChild(b);
  }
}
chips(document.getElementById("f-rooms"), roomsAll, "rooms", v => v + " rum");
chips(document.getElementById("f-omr"),   omrAll,   "omr",
      v => v.replace("København/Frederiksberg", "Kbh./Frb."));
const shortType = v => v;
chips(document.getElementById("f-type"),  typeAll,  "type", shortType);

for (const b of document.querySelectorAll("[data-all]")) {
  const key = b.dataset.all;
  const map = {rooms: [roomsAll, "f-rooms", v => v + " rum"],
               omr:   [omrAll, "f-omr", v => v.replace("København/Frederiksberg","Kbh./Frb.")],
               type:  [typeAll, "f-type", shortType]};
  b.onclick = () => { const [vals, host, lab] = map[key]; S[key] = new Set(vals);
                      chips(document.getElementById(host), vals, key, lab); render(); };
}

const rent = document.getElementById("f-rent"),
      area = document.getElementById("f-area"),
      maxp = document.getElementById("f-max");
rent.max = Math.ceil(rentMax / 500) * 500; rent.step = 500; rent.value = rent.max;
area.max = Math.ceil(areaMax / 5) * 5;     area.step = 5;   area.value = 0;
maxp.min = Math.floor(plMin / 100) * 100;  maxp.max = plMax; maxp.step = 50; maxp.value = plMax;
for (const [el, k] of [[rent,"rent"],[area,"area"],[maxp,"max"]])
  el.oninput = () => { S[k] = +el.value; render(); };

document.getElementById("btn-best").onclick = e => {
  S.bestOnly = !S.bestOnly; e.currentTarget.setAttribute("aria-pressed", S.bestOnly); render();
};
document.getElementById("burger").onclick = () =>
  document.getElementById("panel").classList.toggle("open");

/* ---- theme ---- */
const mq = matchMedia("(prefers-color-scheme: dark)");
const stored = localStorage.getItem("aab-theme");
if (stored) document.documentElement.dataset.theme = stored;
const isDark = () => (document.documentElement.dataset.theme || (mq.matches ? "dark" : "light")) === "dark";
document.getElementById("btn-theme").onclick = () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("aab-theme", next); } catch {}
  if (typeof basemap === "function") { basemap(); detailLayer(); }
  render();
};
mq.addEventListener("change", () => {
  if (document.documentElement.dataset.theme) return;
  basemap(); detailLayer(); render();
});

/* ---- map ---- */
const map = L.map("map", { zoomControl: false }).setView([55.70, 12.45], 11);
L.control.zoom({ position: "bottomleft" }).addTo(map);
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services";
const ATTR = 'Kort: Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
           + ' · geokodning: <a href="https://dataforsyningen.dk/">Dataforsyningen (DAWA)</a>';
map.createPane("detail").style.zIndex = 250;   // above the base tiles, below the markers
map.getPane("detail").classList.add("leaflet-detail-pane");
map.createPane("labels").style.zIndex = 260;   // place names on top of whichever base is showing
map.getPane("labels").style.pointerEvents = "none";

// Grey canvas reads cleanly under the markers but only has tiles to z16;
// above that we fade in the fully detailed street map.
let baseLayer = null, refLayer = null;
const detail = L.tileLayer(`${ESRI}/World_Street_Map/MapServer/tile/{z}/{y}/{x}`,
  { maxZoom: 19, minZoom: 17, pane: "detail", attribution: ATTR });

function basemap() {
  const tone = isDark() ? "Dark" : "Light";
  if (baseLayer) map.removeLayer(baseLayer);
  if (refLayer) map.removeLayer(refLayer);
  const opts = { maxZoom: 19, maxNativeZoom: 16, attribution: ATTR };
  baseLayer = L.tileLayer(`${ESRI}/Canvas/World_${tone}_Gray_Base/MapServer/tile/{z}/{y}/{x}`, opts).addTo(map);
  refLayer  = L.tileLayer(`${ESRI}/Canvas/World_${tone}_Gray_Reference/MapServer/tile/{z}/{y}/{x}`,
                          { ...opts, pane: "labels" }).addTo(map);
}
function detailLayer() {
  const want = map.getZoom() >= 17;
  if (want && !map.hasLayer(detail)) detail.addTo(map);
  if (!want && map.hasLayer(detail)) map.removeLayer(detail);
  if (refLayer) refLayer.setOpacity(want ? 0 : 1);   // street tiles bring their own labels
}
basemap();
map.on("zoomend", detailLayer);
const layer = L.layerGroup().addTo(map);
document.getElementById("btn-fit").onclick = () => fit(true);

let markers = [], lastBounds = null, coreBounds = null;

/* ---- render ---- */
function passes(r) {
  const g = r.g;
  if (!r.active) return false;
  if (!S.rooms.has(g.rooms)) return false;
  if (!S.omr.has(r.place.omraade)) return false;
  if (!S.type.has(g.cat)) return false;
  if ((g.rent_min ?? 0) > S.rent) return false;
  if ((g.area_max ?? 0) < S.area) return false;
  if (g.placement > S.max) return false;
  return true;
}

function quintiles(sorted) {                   // sorted ascending = best first
  const n = sorted.length, cuts = [];
  for (let i = 1; i < 5; i++) cuts.push(sorted[Math.min(n - 1, Math.floor(n * i / 5))]);
  return cuts;
}
function tierOf(v, cuts) {                     // 4 = best, 0 = worst
  let t = 0; while (t < 4 && v >= cuts[t]) t++;
  return 4 - t;
}

function render() {
  const hits = REC.filter(passes);
  const byPlace = new Map();
  for (const r of hits) {
    if (!byPlace.has(r.place)) byPlace.set(r.place, []);
    byPlace.get(r.place).push(r.g);
  }
  for (const gs of byPlace.values()) gs.sort((a, b) => a.placement - b.placement);

  const shown = S.bestOnly
    ? [...byPlace.values()].map(gs => gs[0].placement)
    : hits.map(r => r.g.placement);
  shown.sort((a, b) => a - b);

  const cuts = shown.length ? quintiles(shown) : [0,0,0,0];
  const cols = tierColors();

  /* legend */
  document.getElementById("scale").innerHTML =
    cols.slice().reverse().map(c => `<div style="background:${c}"></div>`).join("");
  document.getElementById("v-count").textContent =
    shown.length ? `${kr(shown[0])} – ${kr(shown[shown.length-1])}` : "ingen";
  const bounds = [shown[0], ...cuts, shown[shown.length - 1]];
  document.getElementById("ranges").innerHTML = shown.length
    ? [4,3,2,1,0].map(t => {
        const lo = t === 4 ? bounds[0] : cuts[4 - t - 1];
        const hi = t === 0 ? bounds[5] : cuts[4 - t] - 1;
        if (hi < lo) return "";
        return `<span><i style="background:${cols[t]}"></i>${kr(lo)}–${kr(hi)}</span>`;
      }).join("")
    : "";

  /* markers */
  layer.clearLayers(); markers = [];
  const pts = [];
  for (const [p, gs] of byPlace) {
    const list = S.bestOnly ? [gs[0]] : gs;
    list.forEach((g, i) => {
      const t = tierOf(g.placement, cuts);
      const extra = (S.bestOnly && gs.length > 1) ? `<sup>+${gs.length - 1}</sup>` : "";
      // fan out the extra groups of one department so they do not stack
      const a = i * 2.399, r = i === 0 ? 0 : 15 + 5 * i;
      const icon = L.divIcon({
        className: "", iconSize: [0, 0], iconAnchor: [0, 0],
        html: `<div class="pinwrap"><div class="pin"
                    style="background:${cols[t]};color:${inkOn(t)};left:${(Math.cos(a)*r*1.6).toFixed(1)}px;top:${(Math.sin(a)*r).toFixed(1)}px"
                    title="${esc(p.name)}: placering ${g.placement}">${kr(g.placement)}${extra}</div></div>`
      });
      const m = L.marker([p.lat, p.lon], {
        icon, zIndexOffset: 2000 - Math.round(g.placement / 10), riseOnHover: true
      });
      m.bindPopup(popup(p, gs, cuts), { maxWidth: 320, autoPanPadding: [24, 24] });
      m._key = p.id + "|" + g.placement;
      m.on("click", () => select(m._key, false));
      layer.addLayer(m); markers.push(m);
      pts.push([p.lat, p.lon]);
    });
  }
  lastBounds = pts.length ? L.latLngBounds(pts).pad(0.06) : null;
  const core = [...byPlace.keys()].filter(p => p.omraade !== "Nordsjælland")
                                  .map(p => [p.lat, p.lon]);
  coreBounds = core.length ? L.latLngBounds(core).pad(0.08) : lastBounds;

  /* list */
  const rows = S.bestOnly
    ? [...byPlace.entries()].map(([p, gs]) => ({p, g: gs[0], n: gs.length}))
    : hits.map(r => ({p: r.place, g: r.g, n: 1}));
  rows.sort((a, b) => a.g.placement - b.g.placement);
  document.getElementById("v-listcount").textContent = rows.length;
  document.getElementById("list").innerHTML = rows.length ? rows.map(({p, g, n}) => {
    const t = tierOf(g.placement, cuts);
    return `<button class="item" data-key="${p.id}|${g.placement}">
      <span class="num" style="background:${cols[t]};color:${inkOn(t)}">${kr(g.placement)}</span>
      <span style="min-width:0">
        <span class="nm">Afd. ${p.id} – ${esc(p.name)}</span>
        <span class="meta">${g.rooms_raw} rum · ${esc(g.rent)} kr. · ${esc(g.area)} m²${
          n > 1 ? ` · +${n - 1} gruppe${n > 2 ? "r" : ""}` : ""}</span>
      </span></button>`;
  }).join("") : `<div class="empty">Ingen opnoteringer matcher filtrene.</div>`;

  for (const b of document.querySelectorAll(".item"))
    b.onclick = () => select(b.dataset.key, true);

  document.getElementById("v-rent").textContent =
    S.rent >= +rent.max ? "alle" : kr(S.rent) + " kr.";
  document.getElementById("v-area").textContent = S.area ? m2(S.area) + " m²" : "alle";
  document.getElementById("v-max").textContent =
    S.max >= plMax ? "alle" : "≤ " + kr(S.max);
  if (S.sel) select(S.sel, false, true);
}

function select(key, zoom, quiet) {
  S.sel = key;
  for (const b of document.querySelectorAll(".item")) b.classList.toggle("on", b.dataset.key === key);
  for (const m of markers) {
    const el = m.getElement()?.querySelector(".pin");
    if (el) el.classList.toggle("on", m._key === key);
  }
  const m = markers.find(x => x._key === key);
  if (m && !quiet) {
    if (zoom) map.setView(m.getLatLng(), Math.max(map.getZoom(), 14), {animate: true});
    m.openPopup();
    if (innerWidth <= 820) document.getElementById("panel").classList.remove("open");
  }
}

function popup(p, gs, cuts) {
  const cols = tierColors();
  const all = p.groups.slice().sort((a, b) => (a.placement ?? 1e9) - (b.placement ?? 1e9));
  const hit = new Set(gs.map(g => g.placement));
  const body = all.map(g => {
    const on = hit.has(g.placement);
    const t = on ? tierOf(g.placement, cuts) : null;
    const num = g.placement === null ? `<span style="color:var(--ink-muted)">${esc(g.raw)}</span>`
      : `<span class="pnum" style="${on
          ? `background:${cols[t]};color:${inkOn(t)}`
          : "background:transparent;color:var(--ink-muted)"}">${kr(g.placement)}</span>`;
    return `<tr class="${on ? "" : "dim"}">
      <td>${num}</td>
      <td>${g.rooms_raw || "–"} rum${g.variant ? `<br><span style="font-size:10.5px;color:var(--ink-muted)">${esc(g.variant)}</span>` : ""}</td>
      <td class="r">${esc(g.rent)}</td>
      <td class="r">${esc(g.area)}</td>
      <td class="r">${g.matches ?? "–"}</td></tr>`;
  }).join("");
  const conf = {high: "Præcis adresse", medium: "Omtrentlig – afdelingskontorets adresse",
                low: "Usikker placering"}[p.conf];
  return `<div class="pop">
    <h2>Afdeling ${p.id} – ${esc(p.name)}</h2>
    <div class="where">${esc(p.geo)} · ${esc(p.omraade)}</div>
    <table>
      <tr><th>Placering</th><th>Bolig</th><th class="r">Husleje/md.</th><th class="r">Areal</th><th class="r">Boliger</th></tr>
      ${body}
    </table>
    <div class="foot">${conf}${p.note ? ` · <span class="warn">${esc(p.note)}</span>` : ""}</div>
  </div>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function fit(animate) { if (lastBounds) map.fitBounds(lastBounds, {animate: !!animate}); }

/* compact dots when zoomed far out, full numbers when zoomed in */
function zoomClass() {
  const compact = map.getZoom() < 11;
  for (const m of markers) m.getElement()?.querySelector(".pin")?.classList.toggle("dot", compact);
}
map.on("zoomend", zoomClass);

render();
if (coreBounds) map.fitBounds(coreBounds, {animate: false});
zoomClass();
detailLayer();
})();
</script>
</body>
</html>
